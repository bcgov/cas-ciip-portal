product_information:
  api_specifications: []
  ministry:
    - Environment and Climate Change Strategy
  product_acronym: CIIP
  product_description: >-
    CIIP is a voluntary program created for industrial operations in B.C.
    Operators must submit a CIIP application form by the program application
    deadline (announced by the program area). As part of the application,
    information about an industrial facility's energy use, emissions, and
    production is required. This project is the portal to that application,
    which upon approval, leads to the GGIRCS (Greenhouse Gas Industrial
    Reporting and Control System) for the Climate Action Secretariat (CAS)
  product_name: CleanBC Industrial Incentive Program
  product_status: stable
  product_urls:
