
route:
  host: ~
  insecure: false

nginx-sidecar:
  image:
    repository: ghcr.io/bcgov/cas-nginx
    tag: 0.2.1
    pullPolicy: Always
  objectNamePrefix: cas-ciip-portal-static
  hostName: dev.ciip.gov.bc.ca
  port: 3001
  internalPort: 3000
  sslTermination: true
  caAccountEmail: ggircs@gov.bc.ca
  storageClassName: netapp-file-standard
  renewalDays: 60
  # Monthly at 8:00 AM UTC
  renewSchedule: "0 8 1 * *"
  clientMaxBodySize: 50M
